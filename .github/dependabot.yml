version: 2

# MathJax, its fonts, SortableJS and Tailwind are pinned in package.json and
# copied into the repository by `npm run vendor`, so a bump is never just a
# lockfile change: the vendored tree has to be regenerated with it. The
# vendored-tree check refuses any pull request where the two disagree, and the
# "Regenerate the vendored tree" workflow does the regenerating on a branch.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # One pull request for all four MathJax packages: they are released together
    # and pinned to the same version, and mixing them renders nothing.
    groups:
      mathjax:
        patterns:
          - mathjax
          - "@mathjax/*"
    ignore:
      # Tailwind 4 replaced the JavaScript config with an in-CSS one, so the
      # bump is a rewrite of tailwind.config.js and scripts/tailwind-input.css,
      # not an update. It is worth doing deliberately, not in a robot's pull
      # request; the 3.x line still gets patches here.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  # The workflows pin actions by major version, which still moves under them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
