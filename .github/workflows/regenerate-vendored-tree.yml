name: Regenerate the vendored tree

# Started by hand from the Actions tab, on the branch that needs it -- normally
# the branch of a Dependabot pull request, whose "Vendored tree" check is red
# because Dependabot updates package.json and nothing else.
#
# Deliberately not automatic. A workflow triggered by a Dependabot pull request
# gets a read-only token, and the way around that (pull_request_target) would
# run `npm ci` for the very dependencies the pull request proposes, executing
# their install scripts with a token that can write to this repository. Asking
# for one click instead is the whole difference.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - name: Commit the tree if it moved
        run: |
          if [ -z "$(git status --porcelain js/mathjax menus/vendor)" ]; then
            echo "Already matches package.json; nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/mathjax menus/vendor
          git commit -m "chore(vendor): regenerate the tree for the pinned versions

Run from the Regenerate the vendored tree workflow. The contents are whatever
\`npm run vendor\` produces from package.json, so the diff is a consequence of
the version bump on this branch and not a change of its own."
          git push
