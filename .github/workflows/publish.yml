name: Publish

# Pushing a tag `vX.Y.Z` publishes that version to npm. Nothing else publishes:
# a release is a deliberate act, and an npm version can never be replaced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # npm authenticates this workflow as a trusted publisher over OIDC, so there
  # is no token to store, rotate or leak. It also gets the release a
  # provenance attestation, which npm shows on the package page.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment configured in npm's trusted publisher settings.
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A tarball whose version does not match the tag it was announced under is
      # the kind of mistake you only notice once it is public and immutable.
      - name: Check the version matches the tag
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      # Nothing is built: the package is the site as it is served. What has to
      # be checked is that the self-hosted MathJax tree did not sneak in — it is
      # 29 MB, `files` excludes it, and the pages fall back to the CDN without
      # it, so a consumer who wants it runs `npm run vendor` themselves.
      - name: Check the tarball
        run: |
          npm pack --pack-destination .
          tar -tzf edicuatex-*.tgz
          ! tar -tzf edicuatex-*.tgz | grep -q "^package/js/mathjax/"
          tar -tzf edicuatex-*.tgz | grep -q "^package/index.html$"
          tar -tzf edicuatex-*.tgz | grep -q "^package/menus/base.json$"

      - name: Publish
        run: npm publish ./edicuatex-*.tgz
